# Instalado em /etc/systemd/system/equadras-backend.service.d/override.conf
# Ajusta a JVM para a VM de 954 MiB: heap fixo pequeno, SerialGC (menos overhead
# que o G1 com 2 vCPU), metaspace e code cache limitados (uso medido: ~119 MB de
# metaspace) e prioridade do Java contra o OOM killer.
[Service]
ExecStart=
ExecStart=/usr/bin/java \
  -Xms192m -Xmx256m \
  -XX:+UseSerialGC \
  -XX:MaxMetaspaceSize=192m \
  -XX:ReservedCodeCacheSize=64m \
  -Xss512k \
  -XX:+ExitOnOutOfMemoryError \
  -jar /opt/equadras/current/equadras.jar
OOMScoreAdjust=-500
