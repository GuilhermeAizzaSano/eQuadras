# Instalado em /etc/nginx/sites-available/equadras (linkado em sites-enabled).
# $remote_addr ja e o IP real do cliente via conf.d/cloudflare-realip.conf.
server {
    server_name equadras.app www.equadras.app;

    # Frontend estático
    root /opt/equadras/current/frontend;
    index index.html;

    # Swagger e Documentação da API com Acesso Restrito (Basic Auth)
    location ~ ^/(swagger-ui|v3/api-docs) {
        auth_basic "Documentacao Restrita eQuadras API";
        auth_basic_user_file /etc/nginx/.htpasswd;
        # Nao repassa o Basic do nginx: a aplicacao rejeita Authorization que nao seja Bearer eq_
        proxy_set_header Authorization "";

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoints do Backend Spring Boot
    location ~ ^/(api|usuarios|quadras|agendamentos|notificacoes|pagamentos|auth|uploads) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Suporte a SSE (Server-Sent Events) para notificacoes
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # Assets do Vite tem hash no nome: cache longo e imutavel
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html sempre revalidado para que um deploy novo seja visto na hora
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Demais rotas sao servidas pelo React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/equadras.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/equadras.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.equadras.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = equadras.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name equadras.app www.equadras.app;
    return 404; # managed by Certbot
}
