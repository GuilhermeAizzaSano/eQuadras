name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend CI (Java 21 / Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and verify Backend
        run: mvn clean verify -DskipTests=false

      - name: Publish backend artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/equadras-*.jar
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend CI (React / TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check and build Frontend
        run: npm run build

      - name: Publish frontend artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Production (OCI VM)
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Evita dois deploys simultâneos disputando o symlink "current" na VM
    concurrency:
      group: deploy-producao
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: artefatos/backend

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: artefatos/release/frontend

      - name: Montar pacote da release
        run: |
          JAR=$(ls artefatos/backend/equadras-*.jar | grep -v '\.original$' | head -n 1)
          test -n "$JAR"
          cp "$JAR" artefatos/release/equadras.jar
          cp deploy/deploy.sh artefatos/release/deploy.sh
          tar -czf release.tar.gz -C artefatos/release .

      - name: Configurar chave SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Enviar e ativar release (build pronto + health check + rollback)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          VERSAO: ${{ github.sha }}
        run: |
          ALVO="$SSH_USER@$SSH_HOST"
          DESTINO="/opt/equadras/releases/$VERSAO"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$ALVO" "mkdir -p '$DESTINO'"
          scp -i ~/.ssh/deploy_key -o BatchMode=yes release.tar.gz "$ALVO:$DESTINO/release.tar.gz"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$ALVO" \
            "cd '$DESTINO' && tar -xzf release.tar.gz && rm release.tar.gz && chmod 755 deploy.sh && ./deploy.sh '$VERSAO'"

      - name: Remover chave SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key
