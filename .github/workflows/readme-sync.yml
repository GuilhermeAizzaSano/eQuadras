name: Sincronizar Documentacao com ReadMe.io

on:
  push:
    branches:
      - main
    paths:
      - 'docs/api/openapi.yaml'
      - '.github/workflows/readme-sync.yml'
  workflow_dispatch:

jobs:
  rdme-openapi:
    name: Sincronizar OpenAPI Specification no ReadMe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Sincronizar OpenAPI Spec via ReadMe CLI
        uses: readmeio/rdme@v8
        with:
          rdme: openapi docs/api/openapi.yaml --key=${{ secrets.README_API_KEY }} --id=${{ secrets.README_API_DEFINITION_ID }}
