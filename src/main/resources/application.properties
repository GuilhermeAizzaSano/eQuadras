spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/equadras_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Tuning para Supabase Pooler
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=60000

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=3

server.address=0.0.0.0

# Valida o schema com as entidades JPA em tempo de inicializacao sem modificar tabelas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Hibernate Batching (reduz round-trips de rede com o banco)
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# Habilita Virtual Threads (Java 21)
spring.threads.virtual.enabled=true

# RFC 7807: Problem Details para APIs HTTP (Spring Boot 3+)
spring.mvc.problem-details.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true

# Mercado Pago Sandbox Access Token (via env var or dev fallback)
mercadopago.access.token=${MERCADOPAGO_ACCESS_TOKEN:}

# JWT (autenticacao stateless)
jwt.secret=${JWT_SECRET:dev-only-troque-em-producao-eQuadras-chave-secreta-minimo-32-bytes}
jwt.expiracao-ms=${JWT_EXPIRACAO_MS:1800000}

# CORS
equadras.cors.origens-permitidas=${EQUADRAS_CORS_ORIGENS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}

# Disable Open In View
spring.jpa.open-in-view=false

# Gzip Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

server.port=${SERVER_PORT:8080}

server.forward-headers-strategy=native
# IP exato do proxy reverso confiavel (NAO usar faixas privadas inteiras).
# ATENCAO: valor abaixo e placeholder de desenvolvimento (loopback) - ajustar para o IP real do proxy antes do deploy em producao.
server.tomcat.remoteip.internal-proxies=127\\.0\\.0\\.1

# Credenciais e configuracoes do Administrador Geral (Master Admin)
admin.master.email=${ADMIN_MASTER_EMAIL:gui@gmail.com}
admin.master.password=${ADMIN_MASTER_PASSWORD:}

# Senha padrao e segredo para contas criadas via Bot WhatsApp
equadras.bot.default-password=${BOT_DEFAULT_PASSWORD:}
equadras.bot.api-secret=${BOT_API_SECRET:dev-bot-secret-equadras-token-123}

# Hibernate Timezone fixo
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Limites globais de Pageable
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50
spring.data.web.pageable.one-indexed-parameters=false
