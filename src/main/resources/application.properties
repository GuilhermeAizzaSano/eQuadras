spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/equadras_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=false
# Flyway ainda nao esta habilitado neste projeto (schema gerenciado por ddl-auto=update).
# Ao habilitar em producao: confirmar o estado real do banco antes do baseline.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

server.address=0.0.0.0

# Cria/atualiza o schema automaticamente durante o desenvolvimento inicial
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Habilita Virtual Threads (Java 21)
spring.threads.virtual.enabled=true

# RFC 7807: Problem Details para APIs HTTP (Spring Boot 3+)
spring.mvc.problem-details.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true

# Mercado Pago Sandbox Access Token (via env var or dev fallback)
mercadopago.access.token=${MERCADOPAGO_ACCESS_TOKEN:}

# JWT (autenticacao stateless)
jwt.secret=${JWT_SECRET:dev-only-troque-em-producao-eQuadras-chave-secreta-minimo-32-bytes}
jwt.expiracao-ms=${JWT_EXPIRACAO_MS:28800000}

# CORS
equadras.cors.origens-permitidas=${EQUADRAS_CORS_ORIGENS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}

# Disable Open In View
spring.jpa.open-in-view=false

# Gzip Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

server.port=${SERVER_PORT:8080}

server.forward-headers-strategy=native
# IP exato do proxy reverso confiavel (NAO usar faixas privadas inteiras).
# ATENCAO: valor abaixo e placeholder de desenvolvimento (loopback) - ajustar para o IP real do proxy antes do deploy em producao.
server.tomcat.remoteip.internal-proxies=127\\.0\\.0\\.1
