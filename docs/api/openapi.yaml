openapi: 3.1.0
info:
  title: eQuadras API - Gestão e Agendamento Esportivo
  description: "Documentação oficial das APIs REST da plataforma eQuadras para integraç\
    ão de sistemas externos, parceiros e aplicativos clientes."
  contact:
    name: Suporte Técnico eQuadras
    url: https://github.com/GuilhermeAizzaSano/eQuadras
    email: contato@equadras.com.br
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
  version: v1.0.0
servers:
- url: http://localhost
  description: Generated server url
security:
- BearerAuth: []
tags:
- name: Quadras
  description: Endpoints de quadras para consumo do Frontend e catálogo geral.
- name: Quadras - API - TCC
  description: Endpoints da API (/api/quadras) otimizados para bots e integrações
    externas (retorno resumido).
- name: Agendamentos
  description: Endpoints de agendamentos e reservas para o Frontend.
- name: Agendamentos - API - TCC
  description: Endpoints da API (/api/agendamentos) para agendamentos via Bot e integrações.
- name: Usuários e Autenticação
  description: Endpoints de usuários e autenticação para o Frontend.
- name: Usuários - API - TCC
  description: Endpoints da API (/api/usuarios) para integrações externas e login.
- name: Pagamentos
  description: Endpoints de pagamentos Pix e simulações para o Frontend.
- name: Pagamentos - API - TCC
  description: Endpoints da API (/api/pagamentos) e webhooks para parceiros.
- name: Notificações
  description: Endpoints de notificações para o painel administrativo do Frontend.
- name: Notificações - API - TCC
  description: Endpoints da API (/api/notificacoes) para streaming SSE e integrações.
- name: Bloqueios de Quadra
  description: Endpoints de bloqueios de horários para o Frontend.
- name: Bloqueios - API - TCC
  description: Endpoints da API (/api/quadras/bloqueios) para bloqueios externos.
paths:
  /usuarios/{id}:
    get:
      tags:
      - Usuários e Autenticação
      summary: Buscar usuário por ID
      description: Consulta os dados de um usuário pelo seu identificador único.
      operationId: buscarPorId
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UsuarioResponseDTO"
    put:
      tags:
      - Usuários e Autenticação
      summary: Editar usuário existente (Apenas Admin Geral)
      description: "Atualiza os dados de um usuário (nome, e-mail, telefone, perfil\
        \ e opcionalmente senha). Apenas o Administrador Geral possui permissão."
      operationId: editar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioEdicaoDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UsuarioResponseDTO"
    delete:
      tags:
      - Usuários e Autenticação
      summary: Excluir usuário (Apenas Admin Geral)
      description: Remove um usuário do sistema. Apenas o Administrador Geral possui
        permissão.
      operationId: excluir
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
  /api/usuarios/{id}:
    get:
      tags:
      - Usuários - API - TCC
      summary: Buscar usuário por ID
      description: Consulta os dados de um usuário pelo seu identificador único.
      operationId: buscarPorId_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UsuarioResponseDTO"
    put:
      tags:
      - Usuários - API - TCC
      summary: Editar usuário existente (Apenas Admin Geral)
      description: "Atualiza os dados de um usuário (nome, e-mail, telefone, perfil\
        \ e opcionalmente senha). Apenas o Administrador Geral possui permissão."
      operationId: editar_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioEdicaoDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UsuarioResponseDTO"
    delete:
      tags:
      - Usuários - API - TCC
      summary: Excluir usuário (Apenas Admin Geral)
      description: Remove um usuário do sistema. Apenas o Administrador Geral possui
        permissão.
      operationId: excluir_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
  /quadras/{id}:
    get:
      tags:
      - Quadras
      summary: Buscar quadra por ID
      description: "Retorna os detalhes completos, fotos e horários de funcionamento\
        \ de uma quadra específica."
      operationId: buscarPorId_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/QuadraResponseDTO"
    put:
      tags:
      - Quadras
      summary: Atualizar quadra (Admin)
      description: "Atualiza os dados cadastrais, endereço e horários de funcionamento\
        \ da quadra do admin autenticado."
      operationId: editar_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuadraCriacaoDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/QuadraResponseDTO"
    delete:
      tags:
      - Quadras
      summary: Excluir quadra (Admin)
      description: Remove a quadra do sistema caso ela não possua histórico de reservas.
      operationId: excluir_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
  /api/quadras/{id}:
    get:
      tags:
      - Quadras - API - TCC
      summary: Buscar quadra por ID
      description: "Retorna os detalhes completos, fotos e horários de funcionamento\
        \ de uma quadra específica."
      operationId: buscarPorId_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/QuadraResponseDTO"
    put:
      tags:
      - Quadras - API - TCC
      summary: Atualizar quadra (Admin)
      description: "Atualiza os dados cadastrais, endereço e horários de funcionamento\
        \ da quadra do admin autenticado."
      operationId: editar_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuadraCriacaoDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/QuadraResponseDTO"
    delete:
      tags:
      - Quadras - API - TCC
      summary: Excluir quadra (Admin)
      description: Remove a quadra do sistema caso ela não possua histórico de reservas.
      operationId: excluir_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
  /api/notificacoes/{id}/ler:
    put:
      tags:
      - Notificações - API - TCC
      summary: Marcar notificação como lida
      description: Atualiza o estado de leitura da notificação.
      operationId: marcarComoLida
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
  /notificacoes/{id}/ler:
    put:
      tags:
      - Notificações
      summary: Marcar notificação como lida
      description: Atualiza o estado de leitura da notificação.
      operationId: marcarComoLida_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
  /notificacoes/ler-todas:
    put:
      tags:
      - Notificações
      summary: Marcar todas as notificações como lidas
      description: Marca todas as notificações do administrador autenticado como lidas.
      operationId: marcarTodasComoLidas
      responses:
        "200":
          description: OK
  /api/notificacoes/ler-todas:
    put:
      tags:
      - Notificações - API - TCC
      summary: Marcar todas as notificações como lidas
      description: Marca todas as notificações do administrador autenticado como lidas.
      operationId: marcarTodasComoLidas_1
      responses:
        "200":
          description: OK
  /usuarios/login:
    post:
      tags:
      - Usuários e Autenticação
      summary: Realizar login
      description: Autentica via e-mail e senha e retorna o token JWT assinado para
        autenticação nas demais rotas.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioLoginDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponseDTO"
  /api/usuarios/login:
    post:
      tags:
      - Usuários - API - TCC
      summary: Realizar login
      description: Autentica via e-mail e senha e retorna o token JWT assinado para
        autenticação nas demais rotas.
      operationId: login_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioLoginDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponseDTO"
  /api/usuarios:
    get:
      tags:
      - Usuários - API - TCC
      summary: Listar todos os usuários (Apenas Admin Geral)
      description: Retorna todos os usuários cadastrados no sistema (ADMIN e CLIENT).
        Apenas o Administrador Geral possui permissão.
      operationId: listarTodos
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsuarioResponseDTO"
    post:
      tags:
      - Usuários - API - TCC
      summary: Cadastrar novo usuário (Apenas Admin Geral ou Auto-cadastro)
      description: "Cria uma nova conta de usuário (Role: CLIENT ou ADMIN). Se for\
        \ anônimo, auto-cadastra como CLIENT."
      operationId: cadastrar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioCriacaoDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /usuarios:
    get:
      tags:
      - Usuários e Autenticação
      summary: Listar todos os usuários (Apenas Admin Geral)
      description: Retorna todos os usuários cadastrados no sistema (ADMIN e CLIENT).
        Apenas o Administrador Geral possui permissão.
      operationId: listarTodos_1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsuarioResponseDTO"
    post:
      tags:
      - Usuários e Autenticação
      summary: Cadastrar novo usuário (Apenas Admin Geral ou Auto-cadastro)
      description: "Cria uma nova conta de usuário (Role: CLIENT ou ADMIN). Se for\
        \ anônimo, auto-cadastra como CLIENT."
      operationId: cadastrar_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioCriacaoDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /quadras/{quadraId}/desbloquear:
    post:
      tags:
      - Bloqueios de Quadra
      summary: Desbloquear horários/dia da quadra (Admin)
      description: Desbloqueia horários ou dias de uma quadra informando o ID do bloqueio
        ou a data e horários no corpo da requisição. Requer ROLE_ADMIN e ser dono
        da quadra.
      operationId: desbloquear
      parameters:
      - name: quadraId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesbloqueioHorarioDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
  /api/quadras/{quadraId}/desbloquear:
    post:
      tags:
      - Bloqueios - API - TCC
      summary: Desbloquear horários/dia da quadra (Admin)
      description: Desbloqueia horários ou dias de uma quadra informando o ID do bloqueio
        ou a data e horários no corpo da requisição. Requer ROLE_ADMIN e ser dono
        da quadra.
      operationId: desbloquear_1
      parameters:
      - name: quadraId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesbloqueioHorarioDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
  /quadras/{id}/fotos:
    get:
      tags:
      - Quadras
      summary: Consultar fotos da quadra
      description: "Retorna a galeria de fotos de uma quadra específica por ID, Nome,\
        \ Tipo de Esporte, Cidade ou Bairro, ou lista todas as quadras com suas fotos\
        \ se nenhum parâmetro for informado."
      operationId: consultarFotos
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: id
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: quadraId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: nome
        in: query
        required: false
        schema:
          type: string
      - name: nomeQuadra
        in: query
        required: false
        schema:
          type: string
      - name: tipoEsporte
        in: query
        required: false
        schema:
          type: string
      - name: esporte
        in: query
        required: false
        schema:
          type: string
      - name: cidade
        in: query
        required: false
        schema:
          type: string
      - name: bairro
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
    post:
      tags:
      - Quadras
      summary: Upload de fotos da quadra (Admin)
      description: "Envia imagens (JPEG, PNG, WebP) de até 5MB para a galeria da quadra\
        \ (máximo 5 fotos)."
      operationId: uploadFotos
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                fotos:
                  type: array
                  items:
                    type: string
                    format: binary
              required:
              - fotos
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/QuadraResponseDTO"
    delete:
      tags:
      - Quadras
      summary: Remover foto da quadra (Admin)
      description: Exclui uma foto específica da galeria e do armazenamento de disco.
      operationId: removerFoto
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: fotoUrl
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/QuadraResponseDTO"
  /api/quadras/{id}/fotos:
    get:
      tags:
      - Quadras - API - TCC
      summary: Consultar fotos da quadra
      description: "Retorna a galeria de fotos de uma quadra específica por ID, Nome,\
        \ Tipo de Esporte, Cidade ou Bairro, ou lista todas as quadras com suas fotos\
        \ se nenhum parâmetro for informado."
      operationId: consultarFotos_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: id
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: quadraId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: nome
        in: query
        required: false
        schema:
          type: string
      - name: nomeQuadra
        in: query
        required: false
        schema:
          type: string
      - name: tipoEsporte
        in: query
        required: false
        schema:
          type: string
      - name: esporte
        in: query
        required: false
        schema:
          type: string
      - name: cidade
        in: query
        required: false
        schema:
          type: string
      - name: bairro
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
    post:
      tags:
      - Quadras - API - TCC
      summary: Upload de fotos da quadra (Admin)
      description: "Envia imagens (JPEG, PNG, WebP) de até 5MB para a galeria da quadra\
        \ (máximo 5 fotos)."
      operationId: uploadFotos_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                fotos:
                  type: array
                  items:
                    type: string
                    format: binary
              required:
              - fotos
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/QuadraResponseDTO"
    delete:
      tags:
      - Quadras - API - TCC
      summary: Remover foto da quadra (Admin)
      description: Exclui uma foto específica da galeria e do armazenamento de disco.
      operationId: removerFoto_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: fotoUrl
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/QuadraResponseDTO"
  /quadras/{id}/bloqueios:
    get:
      tags:
      - Bloqueios de Quadra
      summary: Listar bloqueios da quadra
      description: Lista todos os bloqueios ativos e futuros da quadra.
      operationId: listarBloqueios
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BloqueioHorarioResponseDTO"
    post:
      tags:
      - Bloqueios de Quadra
      summary: Criar bloqueio de horário/dia (Admin)
      description: Bloqueia um dia inteiro ou um intervalo de horários de uma quadra.
        Requer ROLE_ADMIN e ser dono da quadra.
      operationId: criarBloqueio
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BloqueioHorarioCriacaoDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BloqueioHorarioResponseDTO"
  /api/quadras/{id}/bloqueios:
    get:
      tags:
      - Bloqueios - API - TCC
      summary: Listar bloqueios da quadra
      description: Lista todos os bloqueios ativos e futuros da quadra.
      operationId: listarBloqueios_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BloqueioHorarioResponseDTO"
    post:
      tags:
      - Bloqueios - API - TCC
      summary: Criar bloqueio de horário/dia (Admin)
      description: Bloqueia um dia inteiro ou um intervalo de horários de uma quadra.
        Requer ROLE_ADMIN e ser dono da quadra.
      operationId: criarBloqueio_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BloqueioHorarioCriacaoDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BloqueioHorarioResponseDTO"
  /api/quadras:
    get:
      tags:
      - Quadras - API - TCC
      summary: Listar quadras ativas / por proximidade e filtros
      description: "Lista todas as quadras ativas. Na rota /quadras (Frontend), retorna\
        \ a lista completa com fotos e disponibilidades (QuadraResponseDTO). Na rota\
        \ /api/quadras (Bot / Integrações), retorna o formato resumido (QuadraResumoResponseDTO).\
        \ Também suporta o parâmetro 'resumido=true/false'."
      operationId: listarTodas
      parameters:
      - name: latitude
        in: query
        required: false
        schema:
          type: number
          format: double
      - name: longitude
        in: query
        required: false
        schema:
          type: number
          format: double
      - name: raioKm
        in: query
        required: false
        schema:
          type: number
          format: double
          default: 2.0
      - name: tipoEsporte
        in: query
        required: false
        schema:
          type: string
      - name: nome
        in: query
        required: false
        schema:
          type: string
