components:
  schemas:
    LocalTime:
      type: string
      description: Horário no formato HH:mm:ss
      example: 14:00:00
    UsuarioEdicaoDTO:
      type: object
      properties:
        nome_usuario:
          type: string
          maxLength: 80
          minLength: 3
          pattern: "^[^<>]*$"
        email_usuario:
          type: string
          maxLength: 100
          minLength: 0
        phone_usuario:
          type: string
        role:
          type: string
          enum:
          - CLIENT
          - ADMIN
        nova_senha:
          type: string
          maxLength: 2147483647
          minLength: 6
      required:
      - email_usuario
      - nome_usuario
      - phone_usuario
    UsuarioResponseDTO:
      type: object
      description: Perfil cadastral de um usuário do sistema
      properties:
        id_usuario:
          type: integer
          format: int64
          description: ID do usuário
          example: 10
        nome_usuario:
          type: string
          description: Nome completo
          example: Arthur Prado
        email_usuario:
          type: string
          description: Endereço de e-mail
          example: arthur.prado@email.com
        phone_usuario:
          type: string
          description: Telefone ou WhatsApp
          example: (11) 99999-8888
        role:
          type: string
          description: Papel no sistema (CLIENT ou ADMIN)
          enum:
          - CLIENT
          - ADMIN
          example: CLIENT
        criadoEm:
          type: string
          format: date-time
          description: Data e hora de criação da conta
          example: 2026-09-04T10:00:00
    DisponibilidadeDiaDTO:
      type: object
      properties:
        diaSemana:
          type: string
          enum:
          - MONDAY
          - TUESDAY
          - WEDNESDAY
          - THURSDAY
          - FRIDAY
          - SATURDAY
          - SUNDAY
        horaInicio:
          $ref: "#/components/schemas/LocalTime"
        horaFim:
          $ref: "#/components/schemas/LocalTime"
    QuadraCriacaoDTO:
      type: object
      properties:
        nome:
          type: string
          maxLength: 100
          minLength: 3
          pattern: "^[^<>]*$"
        tipoEsporte:
          type: string
          enum:
          - FUTEBOL
          - FUTSAL
          - VOLEI
          - BEACH_TENNIS
          - BASQUETE
          - TENIS
        valorHora:
          type: number
          minimum: 0.01
        cep:
          type: string
          pattern: "^\\d{5}-\\d{3}$"
        logradouro:
          type: string
          maxLength: 255
          minLength: 0
        bairro:
          type: string
          maxLength: 100
          minLength: 0
        cidade:
          type: string
          maxLength: 100
          minLength: 0
        estado:
          type: string
          maxLength: 2
          minLength: 0
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        descricao:
          type: string
          maxLength: 2000
          minLength: 0
        dataLimiteAgendamento:
          type: string
          format: date
        fotos:
          type: array
          items:
            type: string
        disponibilidades:
          type: array
          items:
            $ref: "#/components/schemas/DisponibilidadeDiaDTO"
      required:
      - nome
      - tipoEsporte
      - valorHora
    QuadraResponseDTO:
      type: object
      description: Detalhes cadastrais completos e horários de funcionamento de uma
        quadra
      properties:
        id_quadra:
          type: integer
          format: int64
          description: ID único da quadra
          example: 1
        nome:
          type: string
          description: Nome da quadra esportiva
          example: Arena Gol Society
        tipoEsporte:
          type: string
          description: Tipo de modalidade esportiva
          enum:
          - FUTEBOL
          - FUTSAL
          - VOLEI
          - BEACH_TENNIS
          - BASQUETE
          - TENIS
          example: FUTEBOL
        valorHora:
          type: number
          description: Valor cobrado por hora de locação em reais
          example: 120.0
        ativa:
          type: boolean
          description: Status de ativação da quadra
          example: true
        cep:
          type: string
          description: CEP do local da quadra
          example: 15000-000
        logradouro:
          type: string
          description: Logradouro / Rua
          example: "Av. Brasil, 1500"
        bairro:
          type: string
          description: Bairro da quadra
          example: Jardim das Flores
        cidade:
          type: string
          description: Cidade onde a quadra está localizada
          example: São José do Rio Preto
        estado:
          type: string
          description: UF do estado
          example: SP
        latitude:
          type: number
          format: double
          description: Coordenada geográfica de latitude
          example: -20.8113
        longitude:
          type: number
          format: double
          description: Coordenada geográfica de longitude
          example: -49.3758
        descricao:
          type: string
          description: Descrição detalhada da infraestrutura da quadra
          example: Grama sintética padrão FIFA com iluminação em LED e vestiários.
        dataLimiteAgendamento:
          type: string
          format: date
          description: Data limite máxima permitida para agendamentos futuros
          example: 2026-12-31
        fotos:
          type: array
          description: Lista de URLs das fotos da galeria da quadra
          items:
            type: string
        disponibilidades:
          type: array
          description: Horários de funcionamento semanais configurados para a quadra
          items:
            $ref: "#/components/schemas/DisponibilidadeDiaDTO"
    UsuarioLoginDTO:
      type: object
      properties:
        email_usuario:
          type: string
        senha_usuario:
          type: string
      required:
      - email_usuario
      - senha_usuario
    LoginResponseDTO:
      type: object
      description: Dados de autenticação bem-sucedida e token JWT
      properties:
        token:
          type: string
          description: Token JWT assinado para autenticação Bearer
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        usuario:
          $ref: "#/components/schemas/UsuarioResponseDTO"
          description: Perfil cadastral do usuário autenticado
    UsuarioCriacaoDTO:
      type: object
      properties:
        nome_usuario:
          type: string
          maxLength: 80
          minLength: 3
          pattern: "^[^<>]*$"
        email_usuario:
          type: string
          maxLength: 100
          minLength: 0
        senha_usuario:
          type: string
          maxLength: 2147483647
          minLength: 6
        phone_usuario:
          type: string
        role:
          type: string
          enum:
          - CLIENT
          - ADMIN
      required:
      - email_usuario
      - nome_usuario
      - phone_usuario
      - senha_usuario
    DesbloqueioHorarioDTO:
      type: object
      description: Dados para desbloquear horários de uma quadra via API
      properties:
        bloqueioId:
          type: integer
          format: int64
          description: ID específico do bloqueio cadastrado (opcional se informada
            a data)
          example: 1
        data:
          type: string
          format: date
          description: Data do bloqueio a ser removido (obrigatório se bloqueioId
            não informado)
          example: 2026-09-05
        horaInicio:
          $ref: "#/components/schemas/LocalTime"
          description: Hora de início do bloqueio (opcional)
          example: 14:00:00
        horaFim:
          $ref: "#/components/schemas/LocalTime"
          description: Hora de término do bloqueio (opcional)
          example: 16:00:00
    BloqueioHorarioCriacaoDTO:
      type: object
      properties:
        data:
          type: string
          format: date
        horaInicio:
          $ref: "#/components/schemas/LocalTime"
        horaFim:
          $ref: "#/components/schemas/LocalTime"
        motivo:
          type: string
        substituirDiaInteiro:
          type: boolean
      required:
      - data
    BloqueioHorarioResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        quadraId:
          type: integer
          format: int64
        data:
          type: string
          format: date
        horaInicio:
          $ref: "#/components/schemas/LocalTime"
        horaFim:
          $ref: "#/components/schemas/LocalTime"
        motivo:
          type: string
        criadoEm:
          type: string
          format: date-time
    AgendamentoResponseDTO:
      type: object
      description: Dados completos de retorno de um agendamento esportivo
      properties:
        id_agendamento:
          type: integer
          format: int64
          description: Identificador único do agendamento
          example: 42
        usuarioId:
          type: integer
          format: int64
          description: ID do usuário que realizou a reserva
          example: 10
        nomeUsuario:
          type: string
          description: Nome do atleta que reservou
          example: Arthur Prado
        telefoneUsuario:
          type: string
          description: Telefone de contato do atleta
          example: (11) 99999-8888
        quadraId:
          type: integer
          format: int64
          description: ID da quadra reservada
          example: 1
        nomeQuadra:
          type: string
          description: Nome da quadra esportiva
          example: Arena Gol Society
        dataHoraInicio:
          type: string
          format: date-time
          description: Data e horário de início da partida
          example: 2026-09-05T19:00:00
        dataHoraFim:
          type: string
          format: date-time
          description: Data e horário de término da partida
          example: 2026-09-05T20:00:00
        valorTotal:
          type: number
          description: Valor total da reserva em reais
          example: 120.0
        status:
          type: string
          description: "Status do agendamento (PENDENTE, CONFIRMADO, CANCELADO)"
          enum:
          - PENDENTE
          - CONFIRMADO
          - CANCELADO
          example: CONFIRMADO
        transacaoPagamentoId:
          type: string
          description: Identificador da transação no gateway de pagamento
          example: mp-pix-987654321
        pixCopiaECola:
          type: string
          description: Chave Pix Copia e Cola emitida pelo gateway
          example: 00020126580014br.gov.bcb.pix...
        qrCodeBase64:
          type: string
          description: Imagem do QR Code Pix codificada em Base64
          example: iVBORw0KGgoAAAANSUhEUgAAA...
        criadoEm:
          type: string
          format: date-time
          description: Data e hora de criação do agendamento
          example: 2026-09-04T15:30:00
    AgendamentoBotRequestDTO:
      type: object
      description: Dados para criação simplificada de reserva via Bot / WhatsApp
      properties:
        quadraId:
          type: integer
          format: int64
          description: ID numérico da quadra (opcional se nomeQuadra ou tipoEsporte
            informado)
          example: 1
        nomeQuadra:
          type: string
          description: Nome ou parte do nome da quadra (opcional)
          example: Quadra Society Principal
        tipoEsporte:
          type: string
          description: Tipo de esporte da quadra (opcional)
          example: SOCIETY
        data:
          type: string
          description: "Data da reserva (ex: '2026-09-05', '15/09', 'amanha', 'sexta')"
          example: 2026-09-05
        horaInicio:
          type: string
          description: "Horário de início (ex: '19:00', '19h', '19')"
          example: 19:00
        horaFim:
          type: string
          description: "Horário de término (opcional, padrão: início + 1h)"
          example: 20:00
        nomeCliente:
          type: string
          description: Nome completo do cliente
          example: Arthur Prado
        telefoneCliente:
          type: string
          description: Telefone ou WhatsApp do cliente com DDD
          example: 11999998888
      required:
      - data
      - horaInicio
      - nomeCliente
      - telefoneCliente
    AgendamentoCriacaoDTO:
      type: object
      properties:
        usuarioId:
          type: integer
          format: int64
        quadraId:
          type: integer
          format: int64
        dataHoraInicio:
          type: string
          format: date-time
        dataHoraFim:
          type: string
          format: date-time
      required:
      - dataHoraFim
      - dataHoraInicio
      - quadraId
    AlterarSenhaDTO:
      type: object
      properties:
        senhaAtual:
          type: string
        novaSenha:
          type: string
          pattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[^a-zA-Z0-9]).{6,}$"
      required:
      - novaSenha
      - senhaAtual
    SseEmitter:
      type: object
      properties:
        timeout:
          type: integer
          format: int64
    Notificacao:
      type: object
      properties:
        id:
          type: integer
          format: int64
        mensagem:
          type: string
        lida:
          type: boolean
        dataCriacao:
          type: string
          format: date-time
    HorarioDisponivelDTO:
      type: object
      description: Representação detalhada de cada slot de horário de uma quadra no
        dia
      properties:
        inicio:
          type: string
          format: time
          description: Horário de início do slot
          example: 14:00:00
        fim:
          type: string
          format: time
          description: Horário de término do slot
          example: 15:00:00
        disponivel:
          type: boolean
          description: Indica se o horário pode ser agendado no momento
          example: true
        status:
          type: string
          description: "Status detalhado: DISPONIVEL, BLOQUEADO, AGENDADO ou INDISPONIVEL"
          enum:
          - DISPONIVEL
          - BLOQUEADO
          - AGENDADO
          - INDISPONIVEL
          example: DISPONIVEL
        motivo:
          type: string
          description: Justificativa ou motivo do status
          example: Disponível
    GradeHorariosResponseDTO:
      type: object
      description: Representação consolidada da grade de horários de uma quadra com
        contexto
      properties:
        id_quadra:
          type: integer
          format: int64
          description: ID único da quadra
          example: 1
        nome_quadra:
          type: string
          description: Nome da quadra
          example: Quadra Society Principal
        tipoEsporte:
          type: string
          description: Tipo de esporte praticado na quadra
          enum:
          - FUTEBOL
          - FUTSAL
          - VOLEI
          - BEACH_TENNIS
          - BASQUETE
          - TENIS
          example: FUTEBOL
        valorHora:
          type: number
          description: Valor cobrado por hora de locação
          example: 120.0
        data:
          type: string
          format: date
          description: Data consultada
          example: 2026-09-05
        horarios:
          type: array
          description: Lista dos slots de horários do dia
          items:
            $ref: "#/components/schemas/HorarioDisponivelDTO"
    QuadraResumoResponseDTO:
      description: Resumo cadastral simplificado da quadra para listagens e bots
      properties:
        id_quadra:
          type: integer
          format: int64
          description: Identificador único da quadra
          example: 1
        nome:
          type: string
          description: Nome da quadra esportiva
          example: Arena Gol Society
        tipoEsporte:
          type: string
          description: Tipo de esporte praticado na quadra
          enum:
          - FUTEBOL
          - FUTSAL
          - VOLEI
          - BEACH_TENNIS
          - BASQUETE
          - TENIS
          example: FUTEBOL
        valorHora:
          type: number
          description: Valor cobrado por hora de locação
          example: 120.0
        endereco:
          type: string
          description: Endereço textual formatado
          example: "Rua das Palmeiras, Centro - São Paulo"
        cep:
          type: string
          description: CEP da quadra
          example: 15000-000
  securitySchemes:
    BearerAuth:
      type: http
      description: "Informe o token JWT no formato: `Bearer <seu_token>` gerado no\
        \ endpoint de login."
      scheme: bearer
      bearerFormat: JWT
